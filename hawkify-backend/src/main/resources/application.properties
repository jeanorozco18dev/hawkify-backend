spring.application.name=hawkify-backend

# Conexion a la base de datos local (ver README raiz del repo).
# Los valores por defecto (tras los ':') funcionan en la maquina donde se creo este proyecto.
# Cada quien puede sobreescribirlos sin tocar este archivo, por ejemplo:
#   DB_USERNAME=postgres DB_PASSWORD=postgres ./mvnw spring-boot:run
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:hawkify}
spring.datasource.username=${DB_USERNAME:jean}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema es administrado a mano con schema.sql (raiz del repo), no por Hibernate.
# ddl-auto=validate: Hibernate compara las entidades @Entity contra las tablas ya creadas
# y falla al arrancar si no coinciden, en vez de alterar el esquema por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (RF-02 login). Secreto local para desarrollo, generado con `openssl rand -base64 48`.
# En un despliegue real este valor debe venir de una variable de entorno, nunca de este archivo.
hawkify.jwt.secret=5icJzg/kV79ey5Bk6tZjIwLBAKoyfsnjxs+uszRddBRsaLqKEt+HFxXenGrY/SPD
hawkify.jwt.expiration-minutes=60
