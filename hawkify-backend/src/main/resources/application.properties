spring.application.name=hawkify-backend

# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL local o Supabase). Todo se sobreescribe con
# variables de entorno; ver README para la cadena de conexion de Supabase.
#   DB_URL=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<ref-del-proyecto>
#   DB_PASSWORD=<password-de-la-base>
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:hawkify}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase (plan gratuito) limita conexiones: un pool pequeno es suficiente.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=15000

# El esquema lo administra schema.sql, no Hibernate: validate falla al arrancar
# si las entidades no coinciden con las tablas, en vez de alterarlas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=true
# Carga en lote de relaciones LAZY: evita N+1 en listados del catalogo y reservas.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------------------
# Seguridad
# ---------------------------------------------------------------------------
# En produccion JWT_SECRET debe venir del entorno (openssl rand -base64 48).
hawkify.jwt.secret=${JWT_SECRET:5icJzg/kV79ey5Bk6tZjIwLBAKoyfsnjxs+uszRddBRsaLqKEt+HFxXenGrY/SPD}
hawkify.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Origenes del frontend autorizados (separados por coma, admite comodines de puerto).
hawkify.cors.origenes=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# URL publica del frontend (se usa en el enlace de recuperacion de contrasena).
hawkify.frontend-url=${FRONTEND_URL:http://localhost:5500}

# Sin proveedor de correo, el enlace de recuperacion va al log. true = tambien en
# la respuesta HTTP (util en demos; nunca en produccion).
hawkify.recuperacion.exponer-enlace=${EXPONER_ENLACE_RECUPERACION:false}

# ---------------------------------------------------------------------------
# Archivos subidos (fotos). Carpeta local servida en /uploads/**.
# ---------------------------------------------------------------------------
hawkify.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------------
# Datos de arranque
# ---------------------------------------------------------------------------
# Crea el superadmin inicial si no existe ninguno (idempotente).
hawkify.bootstrap.superadmin.correo=${SUPERADMIN_CORREO:}
hawkify.bootstrap.superadmin.password=${SUPERADMIN_PASSWORD:}
# Carga usuarios, herramientas y reservas de demostracion si el catalogo esta vacio.
hawkify.demo.seed=${DEMO_SEED:true}

server.error.include-message=never
# Render, Railway y Cloud Run inyectan PORT; en local se usa 8080 (o SERVER_PORT).
server.port=${PORT:${SERVER_PORT:8080}}
# Detrás del proxy HTTPS de la plataforma: respeta X-Forwarded-* (URLs de fotos con https, IP real en auditoría).
server.forward-headers-strategy=framework
